<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9FC"/>
      <stop offset="0.55" stop-color="#FFDCEB"/>
      <stop offset="1" stop-color="#D2F3E7"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C4D8"/>
      <stop offset="0.5" stop-color="#F5A6C8"/>
      <stop offset="1" stop-color="#E98DB7"/>
    </linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2F3E7"/>
      <stop offset="1" stop-color="#77CDB1"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)" stroke="#F7C4D8" stroke-width="8"/>
  <!-- little floating hearts -->
  <g stroke="#C96F9D" stroke-width="4" stroke-linejoin="round">
    <path fill="#F7C4D8" d="M150 118 C124 98 112 82 112 68 C112 56 122 48 132 48 C140 48 146 52 150 58 C154 52 160 48 168 48 C178 48 188 56 188 68 C188 82 176 98 150 118 Z"/>
    <path fill="#A9E5D0" stroke="#4FA88C" d="M362 104 C342 89 333 77 333 67 C333 58 340 52 348 52 C354 52 359 55 362 60 C365 55 370 52 376 52 C384 52 391 58 391 67 C391 77 382 89 362 104 Z"/>
  </g>
  <!-- heart -->
  <path d="M256 430 C150 360 96 300 96 236 C96 186 134 150 180 150 C214 150 240 168 256 196 C272 168 298 150 332 150 C378 150 416 186 416 236 C416 300 362 360 256 430 Z"
        fill="url(#heart)" stroke="#C96F9D" stroke-width="8" stroke-linejoin="round"/>
  <path d="M256 430 C150 360 96 300 96 236 C96 186 134 150 180 150 C214 150 240 168 256 196 C272 168 298 150 332 150 C378 150 416 186 416 236 C416 300 362 360 256 430 Z"
        fill="url(#gloss)"/>
  <!-- play triangle (streaming) -->
  <path d="M232 238 L232 330 L306 284 Z" fill="#FFF9FC" stroke="#FFF9FC" stroke-width="10" stroke-linejoin="round"/>
  <!-- mint ribbon bow -->
  <g stroke="#4FA88C" stroke-width="5" stroke-linejoin="round" fill="url(#bow)">
    <path d="M256 168 C222 132 182 132 186 166 C190 196 228 190 256 176 Z"/>
    <path d="M256 168 C290 132 330 132 326 166 C322 196 284 190 256 176 Z"/>
    <path d="M248 176 L232 222 L250 214 L256 230 L262 214 L280 222 L264 176 Z"/>
    <circle cx="256" cy="172" r="14"/>
  </g>
  <!-- sparkles -->
  <g fill="#FFFFFF" stroke="#DCCCF7" stroke-width="3">
    <path d="M410 104 L418 128 L442 136 L418 144 L410 168 L402 144 L378 136 L402 128 Z"/>
    <path d="M98 344 L103 360 L119 365 L103 370 L98 386 L93 370 L77 365 L93 360 Z"/>
  </g>
  <circle cx="440" cy="196" r="6" fill="#A9E5D0"/>
  <circle cx="72" cy="140" r="7" fill="#F5A6C8"/>
</svg>
