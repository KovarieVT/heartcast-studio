# Builds the real Windows deliverables on a GitHub-hosted Windows runner:
#   • libobs + engine plugins from OBS Studio source (pinned tag, UI/browser disabled)
#   • KovaLive.exe (Qt 6 + libobs), unit tests, best-effort engine smoke test
#   • portable ZIP + Inno Setup installer (KovaLive-<ver>-Setup.exe)
#   • optional Authenticode signing via Azure Artifact Signing (only when its secrets are configured)
#   • on version tags (v*): a GitHub Release with an update.json feed for the in-app updater
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pull-request builds are replaced by newer pushes; builds of main always run to completion
# (so a finished Windows job never shows up as "cancelled" because of a later push).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OBS_VERSION: "32.2.2"          # engine source; bump deliberately and re-run tests
  # Must be the SAME Qt OBS ${OBS_VERSION}'s prebuilt deps use (obs-deps 2026-07-15 → Qt 6.11.1):
  # the obs-vst plugin is built by OBS against that Qt and links to its DLLs at load time.
  QT_VERSION: "6.11.1"
  VST3_SDK_TAG: "v3.8.0_build_66"   # Steinberg VST3 SDK (MIT), commit 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
  # Our OWN DirectShow virtual-camera CLSID so we never collide with an OBS install
  VIRTUALCAM_GUID: "B7A3E4D1-5C2F-4A8E-9D61-3F0C2E8B7A54"

jobs:
  windows-x64:
    runs-on: windows-2025-vs2026   # same image OBS uses for its own Windows builds
    timeout-minutes: 120
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Checkout KovaLive
        uses: actions/checkout@v6
        with: { path: kovalive }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path kovalive/CMakeLists.txt -Pattern 'set\(APP_VERSION\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------- engine
      - name: Cache engine build
        id: obscache
        uses: actions/cache@v5
        with:
          path: obs-dist
          key: obs-${{ env.OBS_VERSION }}-${{ env.VIRTUALCAM_GUID }}-v4

      - name: Checkout OBS Studio ${{ env.OBS_VERSION }}
        if: steps.obscache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          path: obs-studio
          submodules: recursive

      - name: Rename the virtual camera device
        if: steps.obscache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $f = "obs-studio/plugins/win-dshow/virtualcam-module/virtualcam-module.cpp"
          $src = Get-Content $f -Raw
          if ($src -notmatch 'L"OBS Virtual Camera"') { throw "virtual camera name not found — OBS source changed, review the patch" }
          $src.Replace('L"OBS Virtual Camera"', 'L"KovaLive Virtual Camera"') | Set-Content -NoNewline $f

      - name: Build libobs + engine plugins
        if: steps.obscache.outputs.cache-hit != 'true'
        working-directory: obs-studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $dist = "${{ github.workspace }}/obs-dist"
          cmake --preset windows-x64 `
            -DENABLE_FRONTEND=OFF -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF -DENABLE_WEBSOCKET=OFF `
            -DVIRTUALCAM_GUID="$env:VIRTUALCAM_GUID"
          cmake --build --preset windows-x64 --config RelWithDebInfo
          # runtime files (DLLs, plugins, data)
          cmake --install build_x64 --config RelWithDebInfo --prefix $dist
          # developer files (headers, obs.lib, libobsConfig.cmake) are EXCLUDE_FROM_ALL in OBS
          cmake --install build_x64 --config RelWithDebInfo --prefix $dist --component Development
          # OBS only bundles its third-party runtime DLLs (FFmpeg, x264, SRT, RIST, mbedTLS, curl,
          # zlib, datachannel…) when building its own frontend, so copy them from .deps ourselves.
          $deps = Get-ChildItem .deps -Directory | Where-Object { $_.Name -like 'obs-deps-*-x64' -and $_.Name -notlike '*qt*' }
          if (-not $deps) { throw "obs-deps folder not found in .deps" }
          foreach ($d in $deps) {
            Get-ChildItem "$($d.FullName)/bin" -Filter *.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notlike 'Qt6*' } | Copy-Item -Destination "$dist/bin/64bit" -Force
          }
          Get-ChildItem "$dist/bin/64bit" -Filter *.dll | ForEach-Object { $_.Name }
          # record which Qt obs-vst was built against, so the app build can refuse a mismatch
          $qtdeps = Get-ChildItem .deps -Directory | Where-Object { $_.Name -like 'obs-deps-qt6-*' } | Select-Object -First 1
          $qtcfg = Get-ChildItem $qtdeps.FullName -Recurse -Filter Qt6ConfigVersionImpl.cmake | Select-Object -First 1
          if (-not $qtcfg) { $qtcfg = Get-ChildItem $qtdeps.FullName -Recurse -Filter Qt6ConfigVersion.cmake | Select-Object -First 1 }
          $qv = (Select-String -Path $qtcfg.FullName -Pattern 'PACKAGE_VERSION "([0-9.]+)"').Matches[0].Groups[1].Value
          Set-Content "$dist/obs-qt-version.txt" $qv
          Write-Host "OBS deps Qt: $qv"
          # libobs' CMake package requires SIMDe headers; they live in OBS's .deps folder
          $simde = Get-ChildItem .deps -Recurse -Filter simde-common.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($simde) {
            Copy-Item -Recurse $simde.Directory.FullName "$dist/include/simde" -Force
          } else {
            git clone --depth 1 --branch v0.8.2 https://github.com/simd-everywhere/simde "$env:RUNNER_TEMP/simde"
            Copy-Item -Recurse "$env:RUNNER_TEMP/simde/simde" "$dist/include/simde" -Force
          }
          if (-not (Get-ChildItem $dist -Recurse -Filter libobsConfig.cmake)) { throw "libobs developer package missing after install" }
          Get-ChildItem "$dist/cmake" | ForEach-Object { $_.Name }

      # ---------------------------------------------------------------- app
      - name: Check Qt matches the engine's
        shell: pwsh
        run: |
          $obsQt = (Get-Content obs-dist/obs-qt-version.txt -Raw).Trim()
          if ($obsQt -ne $env:QT_VERSION) { throw "OBS deps use Qt $obsQt but QT_VERSION is $env:QT_VERSION — obs-vst would fail to load. Set QT_VERSION to $obsQt." }

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets qtimageformats
          aqtversion: "==3.3.*"
          cache: true

      - name: Steinberg VST3 SDK ${{ env.VST3_SDK_TAG }} (for the VST3 host)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch $env:VST3_SDK_TAG https://github.com/steinbergmedia/vst3sdk "$env:RUNNER_TEMP/vst3/vst3sdk"
          Push-Location "$env:RUNNER_TEMP/vst3/vst3sdk"
          if ((git rev-parse HEAD) -ne "9fad9770f2ae8542ab1a548a68c1ad1ac690abe0") { throw "VST3 SDK tag moved — review before building" }
          git submodule update --init --depth 1 base pluginterfaces public.sdk
          Pop-Location

      - name: Configure & build KovaLive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $libobs = Get-ChildItem -Recurse obs-dist -Filter libobsConfig.cmake | Select-Object -First 1
          $pthr   = Get-ChildItem -Recurse obs-dist -Filter w32-pthreadsConfig.cmake | Select-Object -First 1
          if (-not $libobs) { throw "libobsConfig.cmake not found in obs-dist" }
          $feed = "https://github.com/${{ github.repository }}/releases/latest/download/update.json"
          cmake -S kovalive -B hcbuild -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;${{ github.workspace }}/obs-dist" `
            -Dlibobs_DIR="$($libobs.DirectoryName)" `
            -Dw32-pthreads_DIR="$($pthr.DirectoryName)" `
            -DKOVALIVE_UPDATE_FEED="$feed" `
            -DKOVALIVE_BUILD_VST3=ON -DSTEINBERG_VST3_PATH="$env:RUNNER_TEMP/vst3"
          cmake --build hcbuild --config Release --parallel
          # stage what CMake installs (KovaLive.exe, obs-vst3 module + scanner + locale)
          cmake --install hcbuild --config Release --prefix "${{ github.workspace }}/app-stage"

      - name: Unit tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:QT_ROOT_DIR\bin;${{ github.workspace }}\obs-dist\bin\64bit;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir hcbuild -C Release --output-on-failure --timeout 300

      # ---------------------------------------------------------------- package
      - name: Download Microsoft VC++ runtime (for the installer)
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe

      - name: Assemble distributable folder
        working-directory: kovalive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          ./tools/package_windows.ps1 -ObsInstall "${{ github.workspace }}/obs-dist" `
            -AppExe "${{ github.workspace }}/hcbuild/bin/Release/KovaLive.exe" `
            -QtBin "$env:QT_ROOT_DIR/bin" -Out "${{ github.workspace }}/dist/KovaLive" `
            -AppStage "${{ github.workspace }}/app-stage" `
            -VcRedist "${{ github.workspace }}/vc_redist.x64.exe"

      - name: Engine test on Windows (D3D11 via Microsoft Basic Render Driver)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Runs the packaged engine exactly as shipped: real libobs, D3D11, plugins, recording,
          # replay buffer, scene persistence, error reporting. (Multistream is covered on Linux.)
          # Full page heap + cdb turn any memory corruption into an exact stack trace.
          $bin = "${{ github.workspace }}/dist/KovaLive/bin/64bit"
          Copy-Item hcbuild/tests/Release/kovalive_engine_test.exe, hcbuild/tests/Release/kovalive_engine_test.pdb $bin
          $log = "$env:RUNNER_TEMP\engine-test.txt"
          $dbg = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          Push-Location $bin
          try {
            if (Test-Path "$dbg\cdb.exe") {
              & "$dbg\gflags.exe" /p /enable kovalive_engine_test.exe /full | Out-Null
              $env:_NT_SYMBOL_PATH = "$bin;${{ github.workspace }}\obs-dist\bin\64bit;${{ github.workspace }}\dist\KovaLive\obs-plugins\64bit;${{ github.workspace }}\hcbuild\bin\Release"
              & "$dbg\cdb.exe" -g -G -lines -c ".echo ===== CRASH =====; .ecxr; kn 60; q" .\kovalive_engine_test.exe -platform windows -o "$log,txt" -o "-,txt"
              & "$dbg\gflags.exe" /p /disable kovalive_engine_test.exe | Out-Null
            } else {
              & .\kovalive_engine_test.exe -platform windows -o "$log,txt"
            }
          } finally {
            Pop-Location
            Remove-Item "$bin/kovalive_engine_test.exe", "$bin/kovalive_engine_test.pdb" -ErrorAction SilentlyContinue
          }
          Write-Host "===== test log ====="
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log written)" }
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if ($text -notmatch 'Totals: \d+ passed, 0 failed') { throw "Windows engine test failed or crashed — see stack trace and log above" }

      - name: Sign all app binaries (Azure Artifact Signing — only if configured)
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          # Smart App Control checks EVERY binary a process loads, so sign all exe + dll
          # (libobs, plugins, FFmpeg and friends) — not just the main executable.
          files-folder: ${{ github.workspace }}\dist\KovaLive
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DSourceDir="${{ github.workspace }}\dist\KovaLive" /DAppVersion="${{ steps.ver.outputs.version }}" `
            kovalive\installer\KovaLive.iss
          Move-Item kovalive\dist\KovaLive-*-Setup.exe dist\

      - name: Sign installer (Azure Artifact Signing — only if configured)
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Portable ZIP + update feed
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist\KovaLive\* -DestinationPath "dist\KovaLive-$v-portable.zip"
          $setup = Get-ChildItem dist\KovaLive-*-Setup.exe | Select-Object -First 1
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          @{ version = $v; url = "https://github.com/${{ github.repository }}/releases/download/v$v/$($setup.Name)";
             sha256 = $sha; size = $setup.Length; notes = "See the release page for what's new." } |
            ConvertTo-Json | Set-Content dist\update.json

      - uses: actions/upload-artifact@v6
        with:
          name: KovaLive-${{ steps.ver.outputs.version }}-windows-x64
          path: |
            dist/KovaLive-*-Setup.exe
            dist/KovaLive-*-portable.zip
            dist/update.json

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KovaLive-*-Setup.exe
            dist/KovaLive-*-portable.zip
            dist/update.json

  linux-engine-tests:
    # Fast feedback: the same engine code against Ubuntu's libobs, including a real
    # multistream to two local RTMP servers.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libobs-dev obs-studio qt6-base-dev qt6-multimedia-dev qt6-websockets-dev \
            libqt6svg6-dev libgl1-mesa-dev mesa-utils xvfb ffmpeg ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build
      - run: ./build/tests/kovalive_unit_tests -platform offscreen
      - run: ./tests/run_engine_test.sh build
